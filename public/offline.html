<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D182A" />
    <title>Asset System Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, sans-serif;
        background: #eef1f6;
        color: #0b1d35;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
        border: 1px solid #d7dee8;
        border-radius: 12px;
        background: #ffffff;
        padding: 24px;
      }

      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 24px;
        line-height: 1.5;
      }

      p {
        margin: 0;
        color: #3c4f6b;
        line-height: 1.6;
      }

      .hint {
        margin-top: 16px;
        border-radius: 8px;
        background: #e9eff8;
        padding: 12px;
        color: #083161;
        font-size: 14px;
      }

      /* The app's dark tokens (src/app/globals.css). This page cannot read the theme cookie without a script, so it follows the OS. */
      @media (prefers-color-scheme: dark) {
        :root {
          background: #0a1424;
          color: #e4ebf5;
        }

        main {
          border-color: #22344f;
          background: #101d31;
        }

        p {
          color: #a9b7cc;
        }

        .hint {
          background: #16294a;
          color: #e4ebf5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Asset System" />
      <h1>ยังเชื่อมต่อระบบไม่ได้</h1>
      <p>ตรวจสอบสัญญาณอินเทอร์เน็ตหรือ VPN แล้วลองเปิดหน้านี้อีกครั้ง</p>
      <p class="hint">หน้าตรวจนับทรัพย์สินจะเก็บคิวสแกนในเครื่องเมื่อส่งข้อมูลไม่สำเร็จ และสามารถกดส่งซ้ำเมื่อกลับมาออนไลน์ได้</p>
    </main>
  </body>
</html>
